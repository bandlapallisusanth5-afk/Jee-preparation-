name: Build JEE Preparation APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q JEEPreparationAndroid-phone-build.zip -d android-source
          cp -R android-source/. .

      - name: Fix Java and Kotlin target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          fix = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", "android {\n" + fix, 1)
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Preparation-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: errorname: Build JEE Preparation APK

