name: Build JEE Preparation APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project and apply improved app
        shell: bash
        run: |
          cp app/src/main/java/com/example/jeepreparation/MainActivity.kt /tmp/ImprovedMainActivity.kt
          unzip -q JEEPreparationAndroid-phone-build.zip -d android-source
          cp -R android-source/. .
          cp /tmp/ImprovedMainActivity.kt app/src/main/java/com/example/jeepreparation/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          block = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", "android {\n" + block, 1)
          if 'com.google.mlkit:text-recognition' not in s:
              s = s.replace("dependencies {", 'dependencies {\n    implementation("com.google.mlkit:text-recognition:16.0.1")', 1)
          p.write_text(s)
          manifest = Path("app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if "android.permission.INTERNET" not in m:
              m = m.replace("<manifest", '<manifest\n    xmlns:tools="http://schemas.android.com/tools"', 1)
              m = m.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          manifest.write_text(m)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Preparation-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
